    script.onerror=()=>finish(new Error('Não foi possível carregar o Apps Script.'));
    const sep=APPS_SCRIPT_URL.includes('?')?'&':'?';
    script.src=APPS_SCRIPT_URL+sep+'callback='+encodeURIComponent(cb)+'&_='+Date.now();
    document.head.appendChild(script);
  });
}

function applyTripData(data,saveCache=true){trip=data.trip;parks=data.parks;dayoffs=data.dayoffs;if(saveCache)localStorage.setItem('tripSheetsCache',JSON.stringify(data))}
function loadTripCache(){try{let x=JSON.parse(localStorage.getItem('tripSheetsCache')||'null');if(x?.trip?.length){applyTripData(x,false);state.sync.last=localStorage.getItem('tripSheetsLastSync')||null;state.sync.status='offline';state.sync.label=state.sync.last?`Última sincronização: ${state.sync.last}`:'Usando dados salvos'}}catch(e){}}
async function syncSheets(silent=false){
  if(!navigator.onLine){state.sync.status='offline';state.sync.label=state.sync.last?`Offline · última sincronização ${state.sync.last}`:'Offline · usando dados salvos';render();if(!silent)toast('Sem internet · usando dados salvos');return false}
  
  state.sync.status='busy';state.sync.label='Atualizando pelo Google Sheets…';render();
  try{
    const payload=await fetchSheetsJsonp();
    const data=buildFromSheets(payload.dayRows,payload.parkRows);
    if(!data.trip.length)throw new Error('A leitura retornou dados, mas nenhuma data pôde ser identificada.');
    applyTripData(data,true);
    const now=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    localStorage.setItem('tripSheetsLastSync',now);
    state.sync={status:'online',label:`Atualizado ${now}`,last:now};
    render();
    if(!silent)toast('Roteiro atualizado pelo Google Sheets');
    return true;
  }catch(e){
    state.sync.status='offline';
    state.sync.label=state.sync.last?`Offline · última sincronização ${state.sync.last}`:'Falha ao conectar ao Google Sheets';
    render();
    if(!silent)toast('Não foi possível atualizar o Google Sheets');
    console.error('Google Sheets sync:',e);
    return false;
  }
}
function save(){localStorage.setItem('tripChecks',JSON.stringify(state.checked));localStorage.setItem('tripChecklist',JSON.stringify(state.checklist));localStorage.setItem('calcCfg',JSON.stringify(state.calc))}
try{state.calc=JSON.parse(localStorage.getItem('calcCfg'))||state.calc}catch(e){}
loadTripCache();
const fmtDate=s=>{let d=new Date(s+'T12:00:00');return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`};
const weekday=s=>days[new Date(s+'T12:00:00').getDay()];
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
function go(screen){state.screen=screen;state.selected=null;render()}
function nav(active){return `<nav class="nav">${[['home','⌂','Início'],['route','☷','Roteiro'],['check','✓','Checklist'],['docs','▣','Documentos'],['more','⋯','Mais']].map(([id,ic,l])=>`<button class="${active===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${l}</button>`).join('')}</nav>`}
function header(title,sub=''){return `<div class="top"><div><div class="title">${title}</div>${sub?`<div class="sub">${sub}</div>`:''}</div></div>`}
function dayCard(d){return `<div class="card day" onclick="openDay('${d[0]}')"><div class="datebox"><b>${fmtDate(d[0]).slice(0,2)}</b><small>${weekday(d[0])}</small></div><div class="daymain"><b>${d[1]}</b><small>${d[2]==='dayoff'?'Day-off':d[2]==='disney'?'Disney':d[2]==='universal'?'Universal':'Outro'}</small></div><div class="chev">›</div></div>`}
function openDay(date){state.selected=date;state.screen='day';render()}
function renderHome(){let d=trip[0];return `<div class="screen">${header('Minha Viagem','ORLANDO → MIAMI · 27 OUT – 15 NOV 2026')}<div class="row between" style="margin:8px 0 12px"><div class="syncpill"><span class="dot ${state.sync.status==='offline'?'off':state.sync.status==='busy'?'busy':''}"></span>${state.sync.label}</div><button class="btn alt" onclick="syncSheets()" ${state.sync.status==='busy'?'disabled':''}>↻ Atualizar</button></div><div class="hero"><div class="eyebrow">Próximo dia</div><h1>${d[1]}</h1><p>${fmtDate(d[0])} · ${weekday(d[0])}</p><div style="margin-top:18px"><button class="btn" onclick="openDay('${d[0]}')">Ver roteiro do dia →</button></div></div><div class="grid2" style="margin-top:12px"><div class="stat"><b>20</b><small>dias</small></div><div class="stat"><b>4</b><small>parques Disney</small></div><div class="stat"><b>6</b><small>dias Universal</small></div><div class="stat"><b>2</b><small>cidades</small></div></div><div class="card"><div class="row between"><div><b>Progresso</b><div class="sub">Planejamento salvo neste aparelho</div></div><b>${Object.values(state.checked).filter(Boolean).length}</b></div></div></div>${nav('home')}`}
function renderRoute(){let list=trip.filter(d=>state.routeFilter==='Todos'||(state.routeFilter==='Day-off'?d[2]==='dayoff':d[2]!=='dayoff'));if(state.routeFilter==='Parques'&&state.parkFilter!=='Todos')list=list.filter(d=>d[2]===state.parkFilter);return `<div class="screen">${header('Roteiro da Viagem',`${trip.length} dias`)}<div class="row between" style="margin:8px 0 12px"><div class="syncpill"><span class="dot ${state.sync.status==='offline'?'off':state.sync.status==='busy'?'busy':''}"></span>${state.sync.label}</div><button class="btn alt" onclick="syncSheets()" ${state.sync.status==='busy'?'disabled':''}>↻ Atualizar</button></div><div class="chips"><button class="chip ${state.routeFilter==='Todos'?'active':''}" onclick="state.routeFilter='Todos';state.parkFilter='Todos';render()">Todos</button><button class="chip ${state.routeFilter==='Parques'?'active':''}" onclick="state.routeFilter='Parques';render()">Parques</button><button class="chip ${state.routeFilter==='Day-off'?'active':''}" onclick="state.routeFilter='Day-off';render()">Day-off</button></div>${state.routeFilter==='Parques'?`<div class="chips" style="margin-top:9px"><button class="chip ${state.parkFilter==='Todos'?'active':''}" onclick="state.parkFilter='Todos';render()">Todos</button><button class="chip ${state.parkFilter==='disney'?'active':''}" onclick="state.parkFilter='disney';render()">Disney</button><button class="chip ${state.parkFilter==='universal'?'active':''}" onclick="state.parkFilter='universal';render()">Universal</button><button class="chip ${state.parkFilter==='other'?'active':''}" onclick="state.parkFilter='other';render()">Outros</button></div>`:''}${list.map(dayCard).join('')}</div>${nav('route')}`}
function renderDay(){
  let date=state.selected,d=trip.find(x=>x[0]===date);
  if(!d)return renderRoute();
  if(d[2]==='dayoff')return renderDayoff(date,d);
  let p=parks[date]||{park:d[1],brand:d[2],arrival:null,open:null,tips:[],items:[]};
  let headerInfo=(p.arrival||p.open)?'<div class="grid2"><div class="card"><div class="sub">🚗 Chegada</div><b>'+(p.arrival||'—')+'</b><div class="sub">estacionamento</div></div><div class="card"><div class="sub">◷ Abertura</div><b>'+(p.open||'—')+'</b><div class="sub">parque</div></div></div>':'';
  let items=p.items.map((it,i)=>'<div class="item"><div class="time">'+(i+1)+'</div><div onclick="openDetail(\''+date+'\','+i+')"><h3>'+it[0]+'</h3><p>'+(it[2]||'Local não informado')+(it[1]?' · ('+(cat[it[1]]||it[1])+')':'')+'</p>'+'</div><button class="check '+(state.checked[date+'-'+i]?'done':'')+'" onclick="event.stopPropagation();toggleCheck(\''+date+'-'+i+'\')"></button></div>').join('');
  let tips=p.tips.length?'<div class="sectionTitle">Dicas do dia</div>'+p.tips.map(t=>'<div class="note">'+t+'</div>').join(''):'';
  if(!p.items.length)items='<div class="empty">Ainda não há atrações cadastradas para este dia.</div>';
  return '<div class="screen"><button class="back" onclick="go(\'route\')">←</button><div style="margin-top:12px"><div class="title">'+p.park+'</div><div class="sub">'+fmtDate(date)+' · '+weekday(date)+' · '+p.brand+'</div></div>'+headerInfo+'<div class="sectionTitle">Roteiro ('+p.items.length+')</div><div class="timeline">'+items+'</div>'+tips+'</div>'+nav('route');
}
function renderDayoff(date,d){let items=dayoffs[date]||[];return `<div class="screen"><button class="back" onclick="go('route')">←</button><div style="margin-top:12px"><div class="title">Day-off</div><div class="sub">${fmtDate(date)} · ${weekday(date)} · ${d[1]}</div></div><div class="hero" style="margin-top:14px"><div class="eyebrow">Agenda do dia</div><h1>${d[1]}</h1><p>Sem estacionamento de parque, sem abertura de parque e sem atrações de parque.</p></div><div class="sectionTitle">Roteiro do dia</div><div class="timeline">${items.map((it,i)=>`<div class="item"><div class="time">${it[0]}</div><div><h3>${it[1]}</h3></div><button class="check ${state.checked[date+'-d-'+i]?'done':''}" onclick="toggleCheck('${date}-d-${i}')"></button></div>`).join('')||'<div class="empty">Não há horários cadastrados para este Day-off.</div>'}</div></div>${nav('route')}`}
function toggleCheck(k){state.checked[k]=!state.checked[k];save();render()}
function openDetail(date,i){state.selected=date;state.detail=i;state.screen='detail';render()}
function renderDetail(){let p=parks[state.selected],it=p.items[state.detail],info=detail[it[0]];return `<div class="screen"><button class="back" onclick="openDay('${state.selected}')">←</button><div style="margin-top:12px"><div class="title">${it[0]}</div><div class="sub">${it[2]||'Local não informado'}${it[1]?` · (${cat[it[1]]||it[1]})`:''}</div></div><div class="card"><div class="eyebrow">Detalhes</div>${info?`<p style="line-height:1.55">${info.desc}</p><ul>${info.facts.map(x=>`<li>${x}</li>`).join('')}</ul><div class="source">Fonte: ${info.source}</div>`:`<div class="mutedbox">Ainda não cadastrei informações oficiais suficientes para esta atração. Por segurança, não vou inventar detalhes.</div>`}</div><div class="card"><b>O que veio do seu roteiro</b><p class="sub">${it[2]||'Local não informado'} · ${it[1]?cat[it[1]]||it[1]:'Categoria não informada'}</p></div></div>${nav('route')}`}
function renderCheck(){let cats=['Documentos','Mala','Parques'];return `<div class="screen">${header('Checklist de Viagem','Editável e salvo no aparelho')}<div class="chips"><span class="chip active">Todos</span></div>${cats.map(c=>{let xs=state.checklist.filter(x=>x.cat===c);return `<div class="sectionTitle">${c} <span class="sub">${xs.filter(x=>x.done).length}/${xs.length}</span></div><div class="card">${xs.map(x=>`<div class="item" style="grid-template-columns:1fr 32px"><div><h3>${x.text}</h3></div><button class="check ${x.done?'done':''}" onclick="toggleList('${x.id}')"></button></div>`).join('')}</div>`}).join('')}<div class="card"><div class="form"><label>Adicionar item</label><input id="newItem" placeholder="Ex.: certificado de febre amarela"><select id="newCat"><option>Documentos</option><option>Mala</option><option>Parques</option></select><button class="btn" onclick="addItem()">+ Adicionar</button></div></div></div>${nav('check')}`}
function toggleList(id){let x=state.checklist.find(x=>x.id===id);if(x){x.done=!x.done;save();render()}}function addItem(){let t=document.getElementById('newItem').value.trim();let c=document.getElementById('newCat').value;if(!t)return;state.checklist.push({id:'custom-'+Date.now(),text:t,cat:c,done:false});save();render();toast('Item adicionado')}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open('viagemDisneyDocs',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function addFile(){let input=document.createElement('input');input.type='file';input.accept='.pdf,image/*';input.onchange=async()=>{let f=input.files[0];if(!f)return;try{let db=await openDB();let tx=db.transaction('files','readwrite');tx.objectStore('files').put({id:crypto.randomUUID(),name:f.name,type:f.type,size:f.size,blob:await f.arrayBuffer()});tx.oncomplete=()=>{render();toast('Arquivo salvo neste aparelho')};}catch(e){toast('Não foi possível salvar o arquivo')}};input.click()}
async function listFiles(){let db=await openDB();return new Promise((res,rej)=>{let r=db.transaction('files').objectStore('files').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function openFile(id){let db=await openDB();let r=await new Promise((res,rej)=>{let q=db.transaction('files').objectStore('files').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});let blob=new Blob([r.blob],{type:r.type||'application/octet-stream'});window.open(URL.createObjectURL(blob),'_blank')}
async function delFile(id){let db=await openDB();let tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>render()}
async function renderDocs(){let fs=[];try{fs=await listFiles()}catch(e){}document.getElementById('app').innerHTML=`<div class="screen">${header('Meus Documentos','Arquivos salvos neste aparelho')}<div class="mutedbox">PDFs e imagens podem ser guardados localmente para acesso sem internet no mesmo aparelho/navegador.</div><button class="btn full" style="margin-top:12px" onclick="addFile()">+ Adicionar arquivo</button><div class="sectionTitle">Arquivos</div><div class="card">${fs.map(f=>`<div class="file"><div class="fileicon">${f.type==='application/pdf'?'📄':'🖼️'}</div><div class="meta"><b>${f.name}</b><small>${(f.size/1024/1024).toFixed(2)} MB</small></div><button class="btn alt" onclick="openFile('${f.id}')">Abrir</button><button class="danger" onclick="delFile('${f.id}')">Excluir</button></div>`).join('')||'<div class="empty">Nenhum arquivo salvo ainda.</div>'}</div></div>${nav('docs')}`}
function renderMore(){const appsUrl=APPS_SCRIPT_URL;return `<div class="screen">${header('Mais','Utilidades da viagem')}<div class="card" onclick="go('calc')"><div class="row between"><div><b>🧮 Calculadora de compras</b><div class="sub">Dólar + imposto + total em US$ e R$</div></div><span>›</span></div></div><div class="card" onclick="go('contacts')"><div class="row between"><div><b>📞 Contatos úteis</b><div class="sub">Hotéis + Consulado do Brasil em Miami</div></div><span>›</span></div></div><div class="card"><div class="sectionTitle" style="margin-top:0">🗺️ Mapas oficiais</div><div class="maplink"><span>Disney World — mapas oficiais</span><a href="https://disneyworld.disney.go.com/pt-br/attractions/map/" target="_blank">Abrir ↗</a></div><div class="maplink"><span>Universal Orlando — mapas oficiais</span><a href="https://www.universalorlando.com/web/en/us/plan-your-visit/resort-maps" target="_blank">Abrir ↗</a></div><div class="source">Os mapas oficiais são acessados pelos sites dos parques. Nesta versão não vou fingir que eles estão incorporados offline.</div></div><div class="card"><div class="row between"><div><div class="sectionTitle" style="margin:0">☁️ Roteiro</div><div class="sub">${state.sync.label}</div></div><button class="btn alt" onclick="syncSheets()">↻ Atualizar</button></div></div><div class="card"><div class="sectionTitle" style="margin-top:0">🔗 Fonte do roteiro</div><div class="mutedbox"><b>Google Sheets é a fonte principal.</b><br>O app lê somente <b>Cronograma Day-off</b> e <b>Cronograma Parques</b>. A terceira aba não é usada. A leitura online é feita por um Web App do Google Apps Script; a última versão sincronizada fica salva para uso offline.</div><div class="source" style="margin-bottom:10px">${appsUrl?'Conexão configurada · '+appsUrl.slice(0,42)+'…':'Conexão ainda não configurada'}</div></div><div class="card" onclick="go('settings')"><div class="row between"><div><div class="sectionTitle" style="margin:0">⚙️ Configurações</div><div class="sub">Dólar: R$ ${state.calc.usd.toFixed(2)} · Imposto: ${state.calc.tax.toFixed(1)}%</div></div><span>›</span></div></div></div>${nav('more')}`}
function renderCalc(){return `<div class="screen"><button class="back" onclick="go('more')">←</button>${header('Calculadora de compras','Valor da loja + imposto + conversão')}<div class="card"><div class="form"><label>Preço do produto (US$)</label><input id="price" type="number" min="0" step="0.01" value="100"><label>Dólar configurado</label><input id="usd" type="number" min="0" step="0.01" value="${state.calc.usd}"><label>Imposto configurado (%)</label><input id="tax" type="number" min="0" step="0.1" value="${state.calc.tax}"><button class="btn" onclick="calc()">Calcular</button></div></div><div id="calcResult"></div><div class="mutedbox">O imposto é apenas o percentual configurado por você para esta calculadora; não é uma afirmação de que 7,8% seja a taxa oficial de todas as compras.</div></div>${nav('more')}`}
function calc(){let p=+document.getElementById('price').value||0;let usd=+document.getElementById('usd').value||0;let tax=+document.getElementById('tax').value||0;state.calc={usd,tax};save();let total=p*(1+tax/100),brl=total*usd;document.getElementById('calcResult').innerHTML=`<div class="result"><div class="sub" style="color:#cfd6e2">Produto</div><div>US$ ${p.toFixed(2)}</div><div class="sub" style="color:#cfd6e2;margin-top:10px">Imposto (${tax.toFixed(1)}%)</div><div>US$ ${(total-p).toFixed(2)}</div><hr style="border:0;border-top:1px solid #4a566b;margin:13px 0"><div class="sub" style="color:#cfd6e2">Total em dólar</div><div class="big">US$ ${total.toFixed(2)}</div><div class="sub" style="color:#cfd6e2;margin-top:10px">Estimativa em reais · dólar R$ ${usd.toFixed(2)}</div><div class="big">R$ ${brl.toFixed(2)}</div></div>`}
function renderSettings(){return `<div class="screen"><button class="back" onclick="go('more')">←</button>${header('Configurações','Valores usados pela calculadora')}<div class="card"><div class="form"><label>Dólar (R$)</label><input id="cfgUsd" type="number" min="0" step="0.01" value="${state.calc.usd}"><label>Imposto (%)</label><input id="cfgTax" type="number" min="0" step="0.1" value="${state.calc.tax}"><button class="btn" onclick="saveSettings()">Salvar configurações</button></div></div><div class="mutedbox">Esses valores ficam salvos neste aparelho. O imposto é um parâmetro da sua calculadora, não uma afirmação sobre a taxa oficial de uma cidade.</div></div>${nav('more')}`}
function saveSettings(){state.calc={usd:+document.getElementById('cfgUsd').value||0,tax:+document.getElementById('cfgTax').value||0};save();toast('Configurações salvas');setTimeout(()=>go('more'),500)}
function renderContacts(){return `<div class="screen"><button class="back" onclick="go('more')">←</button>${header('Contatos úteis','Dados consultados em sites oficiais')}<div class="card contact"><h3>🏨 Celebration Suites</h3><div class="sub">Orlando / Kissimmee</div><p>5820 W Irlo Bronson Memorial Hwy, Kissimmee, FL 34746</p><p>Telefone: <a href="tel:+14073967900">+1 407 396 7900</a></p><p>WhatsApp: <a href="https://wa.me/14079209305" target="_blank">+1 407 920 9305</a></p></div><div class="card contact"><h3>🌴 Seacoast Suites</h3><div class="sub">Miami Beach</div><p>5101 Collins Ave, Miami Beach, FL 33140</p><p>Telefone: <a href="tel:+13058655152">+1 305 865 5152</a></p><p>E-mail: <a href="mailto:reservations@seacoastsuites.com">reservations@seacoastsuites.com</a></p></div><div class="card contact"><h3>🇧🇷 Consulado-Geral do Brasil em Miami</h3><div class="sub">Atendimento consular</div><p>3150 SW 38th Ave, Suite 100, Miami, FL 33146</p><p>O app deixa o contato oficial como atalho para consulta atualizada.</p><p><a href="https://www.gov.br/mre/pt-br/consulado-miami" target="_blank">Abrir página oficial ↗</a></p></div></div>${nav('more')}`}
function render(){let app=document.getElementById('app');if(state.screen==='home')app.innerHTML=renderHome();else if(state.screen==='route')app.innerHTML=renderRoute();else if(state.screen==='day')app.innerHTML=renderDay();else if(state.screen==='detail')app.innerHTML=renderDetail();else if(state.screen==='check')app.innerHTML=renderCheck();else if(state.screen==='docs'){renderDocs();return}else if(state.screen==='more')app.innerHTML=renderMore();else if(state.screen==='calc')app.innerHTML=renderCalc();else if(state.screen==='contacts')app.innerHTML=renderContacts();else if(state.screen==='settings')app.innerHTML=renderSettings()}
render();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('Service worker:',e)));
window.addEventListener('online',()=>syncSheets(true));
setTimeout(()=>syncSheets(true),150);
</script></body></html>
